name: Release

# Publishes to PyPI through Trusted Publishing: no API token is stored anywhere. PyPI trusts
# this file (release.yml) in aidagroup/LLM-zipper, running in the "pypi" environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - name: Check that the tag matches the package version
        run: |
          wheel="dist/llm_zipper-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__; built: $(ls dist)"
            exit 1
          fi
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-zipper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
